name: C/C++ CI with Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libcunit1 libcunit1-dev lcov gcovr cmake

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure -V

    - name: Generate Coverage Report (lcov)
      run: |
        cd build
        # Сбор данных покрытия
        lcov --directory . --capture --output-file coverage.info
        # Удаление системных и тестовых файлов
        lcov --remove coverage.info '/usr/*' '*/test/*' '*/build/*' --output-file coverage_filtered.info
        # Вывод статистики
        lcov --list coverage_filtered.info
        
        # Вывод итогового процента покрытия
        echo "========== COVERAGE SUMMARY =========="
        lcov --summary coverage_filtered.info
        echo "======================================="

    - name: Generate HTML Coverage Report
      run: |
        cd build
        mkdir -p coverage_html
        genhtml coverage_filtered.info --output-directory coverage_html --title "Flotilla Project Coverage" --legend
        
    - name: Upload HTML Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report
        path: build/coverage_html/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/coverage_filtered.info
        fail_ci_if_error: false
        verbose: true
        flags: unittests
        name: codecov-umbrella
