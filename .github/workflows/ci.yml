name: C/C++ CI with Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libcunit1 libcunit1-dev lcov gcovr cmake

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    - name: Run Unit Tests
      run: |
        cd build
        # Запуск тестов
        ./test_runner || true
        echo "Tests completed"

    - name: Verify coverage data
      run: |
        cd build
        echo "=== Checking for .gcda files ==="
        find . -name "*.gcda" -ls
        echo "=== Checking for .gcno files ==="
        find . -name "*.gcno" -ls

    - name: Generate Coverage Report (lcov)
      run: |
        cd build
        # Сбор данных покрытия с игнорированием ошибок
        lcov --directory . --capture --output-file coverage.info --ignore-errors unused,source
        
        # Удаление системных и тестовых файлов
        lcov --remove coverage.info \
             '/usr/*' \
             '*/test/*' \
             '*/CMakeFiles/*' \
             --output-file coverage_filtered.info \
             --ignore-errors unused
        
        # Вывод статистики
        echo "========== COVERAGE SUMMARY =========="
        lcov --summary coverage_filtered.info --ignore-errors unused
        echo "======================================="
        
        # Детальный список
        lcov --list coverage_filtered.info --ignore-errors unused

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/coverage_filtered.info
        fail_ci_if_error: false
        verbose: true
        flags: unittests
